# LogiCRM — single-service deployment (API + SPA on one origin).
#
#   1. cp .env.example .env   (set JWT_SECRET — see backend/.env.example)
#   2. docker compose up -d
#
# Use the prebuilt image from GHCR (set by the deploy workflow) or build locally.
services:
  logicrm:
    image: ghcr.io/thebnymc-png/logi-crm:latest
    build:
      context: .
      args:
        # Baked into the SPA at build time. Set VITE_CLERK_PUBLISHABLE_KEY to
        # build the Clerk-enabled frontend (must pair with CLERK_SECRET_KEY below).
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"      # bound to localhost; Cloudflare Tunnel reaches it
    environment:
      NODE_ENV: production
      PORT: "3001"
      # Provide ONE of these: JWT_SECRET (built-in auth) or CLERK_SECRET_KEY (Clerk).
      JWT_SECRET: ${JWT_SECRET:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      DB_PATH: /data/crm.db
    volumes:
      - logicrm-data:/data        # persistent SQLite (crm.db + WAL sidecars)

  # ── Optional: expose the service to Cloudflare without opening any port ──
  # Create a tunnel in the Cloudflare Zero Trust dashboard, copy its token,
  # set TUNNEL_TOKEN in .env, then `docker compose --profile tunnel up -d`.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - logicrm

volumes:
  logicrm-data:
