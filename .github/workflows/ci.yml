name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # ── Frontend: install + production build ──
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # ── Backend: install (compiles better-sqlite3) ──
      - name: Install backend deps
        working-directory: backend
        run: npm ci

      # ── Smoke test: boot the server and hit the health endpoint ──
      - name: Smoke test API
        working-directory: backend
        env:
          JWT_SECRET: ci-smoke-test-secret
          NODE_ENV: production
        run: |
          node server.js & SERVER_PID=$!
          for i in $(seq 1 15); do
            if curl -fs http://127.0.0.1:3001/api/health >/dev/null; then
              echo "Health check passed"; break
            fi
            sleep 1
            if [ "$i" -eq 15 ]; then echo "Server did not become healthy"; kill $SERVER_PID; exit 1; fi
          done
          # Verify seed login works end-to-end
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3001/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@logisticscrm.com","password":"admin123"}')
          kill $SERVER_PID
          if [ "$code" != "200" ]; then echo "Login smoke test failed ($code)"; exit 1; fi
          echo "Login smoke test passed"
