# Fly.io configuration for the LogiCRM backend (serves API + SPA).
# Rename `app` to your chosen Fly app name before first deploy:
#   fly launch --no-deploy   (or)   fly apps create <name>
#
# SQLite is single-writer, so this app MUST run as exactly ONE machine with ONE
# volume. Do not `fly scale count` above 1 (use LiteFS if you later need HA).

app = 'logicrm'
primary_region = 'syd'   # Sydney — closest to the QLD/AU client

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '3001'
  DB_PATH = '/data/crm.db'
  # JWT_SECRET is set as a secret, not here:  fly secrets set JWT_SECRET=...
  # (Once Clerk lands, JWT_SECRET is replaced by CLERK_SECRET_KEY.)

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1          # keep the single SQLite machine always on
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

# Persistent SQLite disk. Create it once with:
#   fly volumes create logicrm_data --region syd --size 1
[mounts]
  source = 'logicrm_data'
  destination = '/data'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
